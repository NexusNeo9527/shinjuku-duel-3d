<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五场景移动端绘制验证</title>
<link rel="icon" href="data:,">
<style>body{margin:0;background:#171c24;color:#eee;font:14px system-ui}canvas{display:block;width:100%}pre{padding:16px;white-space:pre-wrap}</style>
<canvas></canvas><pre id="results">正在对比原始提交和移动端批量提交…</pre>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { batchArenaRubble, syncArenaRubble } from '../src/three/arenaRubble.js';
const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('canvas'), antialias: false, preserveDrawingBuffer: true });
renderer.setSize(844, 390, false); renderer.setPixelRatio(1.3);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const camera = new THREE.PerspectiveCamera(55, 844 / 390, .1, 3000);
const world = new THREE.Scene(); world.background = new THREE.Color('#899ba9');
world.add(new THREE.HemisphereLight(0xc2dcff, 0x666044, 2));
const sun = new THREE.DirectionalLight(0xffeed0, 3); sun.position.set(-12, 26, 15); world.add(sun);
const gl = renderer.getContext(), pixels = () => {
  const p = new Uint8Array(gl.drawingBufferWidth * gl.drawingBufferHeight * 4);
  gl.readPixels(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight, gl.RGBA, gl.UNSIGNED_BYTE, p); return p;
};
function render() { renderer.render(world, camera); return { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles }; }
window.arenaCosts = [];
for (const name of ['mahito-domain', 'hidden-inventory', 'hidden-inventory-rematch', 'shibuya-clash', 'shibuya-final']) {
  const { scene } = await new GLTFLoader().loadAsync(`/models/${name}.glb`);
  if (name === 'mahito-domain') scene.traverse(m => { if (m.isMesh) m.material.fog = false; });
  world.add(scene);
  const poses = name === 'mahito-domain' ? [[0, 4, 9, 0, 6, -8]] : [[100, 160, 120, 0, 6, 0], [0, 3, 25, 0, 2, -35], [55, 3, 55, -55, 2, -55]];
  const before = poses.map(p => { camera.position.set(...p.slice(0, 3)); camera.lookAt(...p.slice(3)); return { ...render(), pixels: pixels() }; });
  batchArenaRubble(scene);
  const views = poses.map((p, i) => {
    camera.position.set(...p.slice(0, 3)); camera.lookAt(...p.slice(3)); const after = render(), image = pixels();
    let delta = 0, changedPixels = 0;
    for (let j = 0; j < image.length; j += 4) {
      const diff = Math.max(...[0, 1, 2].map(c => Math.abs(image[j+c] - before[i].pixels[j+c])));
      delta += diff; if (diff > 3) changedPixels++;
    }
    return { before: { calls: before[i].calls, triangles: before[i].triangles }, after, meanMaxChannelDelta: delta / (image.length / 4), changedPixelsAbove3: changedPixels };
  });
  const rubble = []; scene.traverse(m => { if (m.isMesh && m.name.startsWith('breakable_')) rubble.push(m); });
  rubble.slice(0, 8).forEach(m => { m.visible = false; }); syncArenaRubble(scene); render();
  rubble.forEach(m => { m.visible = true; }); syncArenaRubble(scene);
  window.arenaCosts.push({ name, views, glError: gl.getError() });
  world.remove(scene);
  scene.traverse(m => { if (m.geometry) m.geometry.dispose(); });
}
document.querySelector('#results').textContent = JSON.stringify(window.arenaCosts, null, 2);
document.body.dataset.ready = 'true';
</script>
